<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GKI Calculator & Insights</title>

  <!-- PWA Manifest & Theme Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f3f4f6;
      --text: #1f2937;
      --panel-bg: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --red: #ef4444;
      --orange: #f97316;
      --yellow: #facc15;
      --green: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .app-container {
      background: var(--panel-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: var(--primary);
    }

    .input-section {
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="number"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px;
    }

    select {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px;
      background-color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .result-section {
      text-align: center;
      margin-bottom: 25px;
      padding: 15px;
      background-color: #f9fafb;
      border-radius: 8px;
    }

    .gki-value {
      font-size: 48px;
      font-weight: 800;
      color: var(--primary);
      margin: 10px 0;
    }

    .glucose-info {
      color: #6b7280;
      font-size: 14px;
    }

    .scale-container {
      position: relative;
      height: 20px;
      background: linear-gradient(to left, var(--red), var(--orange), var(--yellow), var(--green));
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .scale-marker {
      position: absolute;
      top: -5px;
      width: 4px;
      height: 30px;
      background-color: black;
      border-radius: 2px;
      transition: left 0.3s ease;
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
    }

    .insight-section {
      padding: 15px;
      border: 1px solid var(--primary);
      border-radius: 8px;
      background-color: #eff6ff;
    }

    .insight-title {
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .insight-text {
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1>GKI Calculator</h1>

  <!-- Input Panel -->
  <div class="input-section">
    <div class="input-group">
      <label>Glucose Level</label>
      <div class="input-row">
        <input type="number" id="glucoseInput" value="90">
        <select id="glucoseUnit">
          <option value="mg_dL">mg/dL</option>
          <option value="mmol_L">mmol/L</option>
        </select>
      </div>
    </div>
    <div class="input-group">
      <label>Ketone Level (mmol/L)</label>
      <input type="number" id="ketoneInput" value="1.5">
    </div>
    <button onclick="calculateGKI()">Calculate GKI</button>
  </div>

  <!-- Calculation Result -->
  <div class="result-section">
    <div>GKI Score:</div>
    <div class="gki-value" id="gkiResult">---</div>
    <div class="glucose-info" id="glucoseInfo"></div>
  </div>

  <!-- Insights Panel -->
  <div class="insight-section">
    <div class="scale-container">
      <div class="scale-marker" id="scaleMarker"></div>
    </div>
    <div class="scale-labels">
      <span>High GKI (Low Ketosis)</span>
      <span>Optimal Ketosis</span>
      <span>High Ketosis (Low GKI)</span>
    </div>
    <div class="insight-title">Diagnostic Insights:</div>
    <div class="insight-text" id="insightText">Enter values above and click 'Calculate GKI' to receive therapeutic insights.</div>
  </div>

</div>

<!-- App Logic Script -->
<script>
  const insightsLookup = [
    { max: 1, text: "GKI: Highest Therapeutic Ketosis. Typically associated with strict clinical protocols for specific health conditions. Ensure medically supervised guidance.", color: "#22c55e" },
    { max: 3, text: "GKI: High Therapeutic Ketosis. Excellent fat-burning and autophagic state. Optimal for robust weight loss, metabolic flexibility, and inflammation reduction.", color: "#4ade80" },
    { max: 6, text: "GKI: Moderate Ketosis. A reliable state for sustained weight management and moderate therapeutic benefits.", color: "#facc15" },
    { max: 9, text: "GKI: Low Ketosis. Generally associated with the beginning of nutritional ketosis or a well-managed weight maintenance phase.", color: "#f97316" },
    { max: Infinity, text: "GKI: Minimal or No Ketosis. A common baseline for non-ketogenic states, suggesting primary carbohydrate utilization.", color: "#ef4444" }
  ];

  function calculateGKI() {
    let glucoseVal = parseFloat(document.getElementById('glucoseInput').value);
    const glucoseUnit = document.getElementById('glucoseUnit').value;
    const ketoneVal = parseFloat(document.getElementById('ketoneInput').value);

    if (isNaN(glucoseVal) || glucoseVal <= 0 || isNaN(ketoneVal) || ketoneVal <= 0) {
      alert("Please enter valid positive numbers for glucose and ketone levels.");
      return;
    }

    let glucose_mmol;
    if (glucoseUnit === "mg_dL") {
      glucose_mmol = glucoseVal / 18.016;
      document.getElementById('glucoseInfo').innerText = `(${glucoseVal.toFixed(1)} mg/dL)`;
    } else {
      glucose_mmol = glucoseVal;
      let glucose_mg_dL = glucoseVal * 18.016;
      document.getElementById('glucoseInfo').innerText = `(${glucose_mg_dL.toFixed(1)} mg/dL)`;
    }

    const gki_score = glucose_mmol / ketoneVal;
    document.getElementById('gkiResult').innerText = gki_score.toFixed(2);

    updateScaleMarker(gki_score);
    updateInsightsPanel(gki_score);
  }

  function updateScaleMarker(gki) {
    let percentage;
    if (gki <= 0.5) percentage = 100;
    else if (gki >= 20) percentage = 0;
    else {
      percentage = 100 - ((Math.log(gki) - Math.log(0.5)) / (Math.log(20) - Math.log(0.5)) * 100);
    }

    const marker = document.getElementById('scaleMarker');
    marker.style.left = `${percentage}%`;
  }

  function updateInsightsPanel(gki) {
    const insightText = document.getElementById('insightText');
    const panel = document.querySelector('.insight-section');

    for (const range of insightsLookup) {
      if (gki < range.max) {
        insightText.innerText = range.text;
        panel.style.borderColor = range.color;
        panel.style.backgroundColor = `${range.color}11`;
        return;
      }
    }
  }

  document.getElementById('glucoseUnit').addEventListener('change', function() {
    let glucoseInput = document.getElementById('glucoseInput');
    let value = parseFloat(glucoseInput.value);

    if (isNaN(value)) return;

    if (this.value === "mmol_L") {
      glucoseInput.value = (value / 18.016).toFixed(1);
    } else {
      glucoseInput.value = (value * 18.016).toFixed(0);
    }
  });
</script>

<!-- Service Worker Registration Script -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registered!'))
        .catch(err => console.error('Service Worker registration failed:', err));
    });
  }
</script>

</body>
</html>
